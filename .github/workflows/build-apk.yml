name: Build Smart House India APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      name: Find Flutter project
run: |
echo "Searching for Flutter project files..."
find . -name pubspec.yaml -not -path '/.dart_tool/'
echo "Repository root:"
ls -la

      - name: Generate Android files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name smart_house_india .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-house-india-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
